            context = canvas.getContext("2d", { willReadFrequently: true });
            var_clicks = 0;
            var_rect_canvas = canvas.getBoundingClientRect();
            canvas.addEventListener("mousedown", on_mouse_down, false);
            canvas.addEventListener("mousemove", on_mouse_move, false);
            canvas.addEventListener("mouseup", on_mouse_up, false);

            Chequeo();
            if (var_nivel_cero) Comprobar_final();
            SistemaReferencia();
            CalcularVista();
            RepresentacionVista();

        let replayMode = false;
        let savingRotation = false;

        async function loadPrevGame(playerStored) {
            let result = {};

            await axios({
                method: "post",
                url: var_url_prev_game,
                data: {email: playerStored.email, games: [{id: playerStored.gameId}]},
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + playerStored.jwttoken
                },
            }).then((response) => {
                if (response.data.player["respStatus"] === "OK") {
                    result = response.data;
                } else {
                    console.log("ERROR Trayendo el juego: " + response.data.player["respStatus"] + "\n" +
                        response.data.player["respMessage"]);
                }
            }).catch((error) => {
                console.log("ERROR in gameUtils.createNewRegisteredGame: " + error.message + " - " + error.response.status);
            });

            return result;
        }

        async function addMove(move) {
            let playerStored = JSON.parse(localStorage.getItem("playerStoreQHCube"));
            if (playerStored) {
                await axios({
                    method: "post",
                    url: var_url,
                    data: { movsList: JSON.stringify(move), id: playerStored.gameId, player: {email: playerStored.email}},
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + playerStored.jwttoken
                    },
                })
                    .then((response) => {
                        if (response.headers["authorization"]) {
                            playerStored.jwttoken = response.headers["authorization"].slice(7);
                        }
                        // TODO: Si el servidor responde con un error, hay que deshacer el movimiento y avisar al usuario.
                        playerStored.movsList += ",[" + move + "]";
                        localStorage.setItem("playerStoreQHCube", JSON.stringify(playerStored));
                    })
                    .catch((error) => {
                        console.log("index.enviarInputTest(input) error: " + error);
                        localStorage.removeItem("playerStoreQHCube");
                        alert("¡¡¡ ERROR !!!. ¿Tienes otra sesión abierta con el mismo juego?. Por favor, vuelva a iniciar sesión.");
                        location.reload();
                    });
            } else {
                // TODO: No tiene token, hay que hacer algo.
                console.log("axios.addMove(move) --> El jugador no tiene token en localStorage");
            }
        }

        async function checkPrevGame() {
            let playerStored = JSON.parse(localStorage.getItem("playerStoreQHCube"));

            if (playerStored) {
                if (playerStored.gameId !== 0 && playerStored.activeGameMode === 1) {
                    let game = await loadPrevGame(playerStored);
                    var_coor = JSON.parse(game.currentInput);
                    // Restaurar la última posición de la figura (último movimiento de tipo [4, x, y, z])
                    const lastPosition = JSON.parse("[" + game.movsList + "]").findLast(mov => mov[0] === 4);
                    if (lastPosition) {
                        var_e3[0] = lastPosition[1];
                        var_e3[1] = lastPosition[2];
                        var_e3[2] = lastPosition[3];
                    }
                    replayMode = false;
                    gameType = 1;
                    pageLoaded();
                } else {
                    // Volver a práctica
                    playerStored.gameId = 0;
                    playerStored.movsList =  "[4,0.7483314773547882,0.6324555320336759,0.2]";
                    playerStored.activeGameMode = 0;
                    gameType = 0;
                    // TODO: Esta parte del else debe tratar de dejar el tema con los componentes como reiniciar práctica.
                    localStorage.setItem("playerStoreQHCube", JSON.stringify(playerStored));
                }
            }
        }
